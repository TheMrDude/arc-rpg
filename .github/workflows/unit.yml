name: Unit tests

# Every push and every fork PR -- see the job condition below for why it is
# expressed that way. No secrets, no network, no production writes, so this is
# safe on a public repo: the whole job is Jest over pure functions in lib/.
#
# It is a separate workflow from overlays.yml deliberately: this finishes in
# seconds without a browser or a Next build, and it should stay the fastest
# signal in the repo so there is never a reason to skip it.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # Runs on every push, plus PRs from forks.
    #
    # push and pull_request both fire for a branch in THIS repo, which would run
    # everything twice per commit. Restricting push to main was the wrong fix: a
    # feature branch pushed before its PR exists then got no CI at all. This
    # condition keeps one run per commit while still covering fork PRs, where
    # push does not fire here.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The guard verifier runs here as well as in prebuild. prebuild only
      # protects a Vercel build; this makes an invalid ESLint config fail a PR
      # before it can be merged. That config was broken for two days.
      - run: npm run verify:guards

      # jest.config.js sets passWithNoTests: false, so a testMatch that stops
      # matching anything fails this step instead of reporting a green run over
      # zero tests.
      - run: npm test
