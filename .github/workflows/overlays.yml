name: Overlay invariants

# Runs on every push and every fork PR. No network, no secrets, no production
# writes -- it
# bundles the real shell into a harness and drives it in a browser. Safe on a
# public repo and fast enough to gate a merge, which is where this belongs: the
# overlay bugs it checks for reached a nine-year-old because nothing gated them.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: overlays-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlays:
    # Runs on every push, plus PRs from forks.
    #
    # push and pull_request both fire for a branch in THIS repo, which would run
    # everything twice per commit. Restricting push to main was the wrong fix: a
    # feature branch pushed before its PR exists then got no CI at all. This
    # condition keeps one run per commit while still covering fork PRs, where
    # push does not fire here.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The harness loads the real compiled CSS, because globals.css's
      # `body { color: #FFFFFF }` is the reason two of these bugs existed. A
      # harness without it would prove nothing.
      - run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - run: npm run test:overlays

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: overlay-trace-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
